<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nothing Note — My Digital Brain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* --- CSS RESET & ROOT --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base: #0B0B0B;
      --card-bg: #161616;
      --card-border: rgba(255, 255, 255, 0.07);
      --card-border-glow: rgba(62, 207, 142, 0.3);
      --text-main: #EDEDED;
      --text-muted: #888888;

      /* Category Accent Colors */
      --accent-life: #3ECF8E;
      --accent-programming: #3B82F6;
      --accent-oracle: #EF4444;
      --accent-linux: #F59E0B;
      --accent-career: #A855F7;
      --accent-ideas: #06B6D4;
      --accent-daily: #6B7280;
    }

    /* --- CUSTOM SCROLLBAR --- */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }

    ::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-life);
    }

    /* --- BASE BODY STYLES (IMMERSIBLE ENVIRONMENT) --- */
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.8;
      position: relative;
    }

    /* Immersive Grid, Noise, and Glow Background layers */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 1;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(62, 207, 142, 0.04) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Container wrapper to pull content above background layers */
    .app-container {
      position: relative;
      z-index: 10;
      max-width: 1600px;
      margin: 0 auto;
      padding: 80px 40px;
      opacity: 0;
      transform: translateY(20px) scale(0.99);
      animation: pageIntro 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pageIntro {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* --- HEADER SECTION --- */
    header {
      text-align: center;
      margin-bottom: 60px;
    }

    header h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #FFFFFF 0%, #A3A3A3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 40px auto;
    }

    /* --- META & STATISTICS PANEL --- */
    .metrics-panel {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto 50px auto;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      text-align: left;
      transition: border-color 0.3s;
    }

    .metric-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .metric-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- CONTROLS: SEARCH & FILTERS --- */
    .controls-wrapper {
      max-width: 700px;
      margin: 0 auto 50px auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: rgba(22, 22, 22, 0.7);
      border: 1px solid var(--card-border);
      padding: 16px 24px;
      border-radius: 99px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      backdrop-filter: blur(8px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-box input:focus {
      border-color: var(--accent-life);
      box-shadow: 0 0 20px rgba(62, 207, 142, 0.15);
      background: #161616;
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .chip {
      background: rgba(22, 22, 22, 0.5);
      border: 1px solid var(--card-border);
      padding: 6px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .chip:hover,
    .chip.active {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.3);
      background: var(--card-bg);
    }

    .chip.active {
      border-color: var(--accent-life);
      box-shadow: 0 0 12px rgba(62, 207, 142, 0.1);
    }

    /* --- REAL MASONRY LAYOUT ENGINE --- */
    .masonry-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 24px;
      align-items: start;
    }

    /* Separate column track generation handling vertical density flow without gaps */
    .masonry-col {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* --- THOUGHT CARD ARCHITECTURE --- */
    .thought-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform-origin: center center;
      transition:
        transform 0.25s cubic-bezier(0.33, 1, 0.68, 1),
        border-color 0.25s cubic-bezier(0.33, 1, 0.68, 1),
        box-shadow 0.25s cubic-bezier(0.33, 1, 0.68, 1),
        opacity 0.4s ease,
        scale 0.4s ease;
      opacity: 0;
      scale: 0.92;
    }

    .thought-card.visible {
      opacity: 1;
      scale: 1;
    }

    /* Premium Micro Interactions on Hover */
    .thought-card:hover {
      transform: translateY(-6px) scale(1.01) rotate(0.4deg);
      border-color: var(--card-border-glow);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.4),
        0 0 20px rgba(62, 207, 142, 0.04);
      z-index: 50;
    }

    .card-meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Mapping dynamic accents safely via custom properties assigned in JavaScript */
    .category-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--cat-color, var(--text-muted));
      box-shadow: 0 0 8px var(--cat-color, var(--text-muted));
    }

    .card-emoji {
      font-size: 1.2rem;
    }

    .thought-card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.4;
      color: #FFFFFF;
    }

    .thought-card p {
      font-size: 0.95rem;
      color: #C2C2C2;
      word-wrap: break-word;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .tag:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .card-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      align-self: flex-end;
      margin-top: auto;
    }

    /* --- EMPTY STATE CONFIGURATION --- */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .empty-state-icon {
      width: 48px;
      height: 48px;
      border: 1px dashed var(--text-muted);
      border-radius: 50%;
      position: relative;
      opacity: 0.4;
    }

    .empty-state-icon::after {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid var(--text-muted);
      border-radius: 50%;
    }

    .empty-state h4 {
      font-size: 1.1rem;
      color: var(--text-main);
      font-weight: 500;
    }

    /* --- RESPONSIVE MEDIA QUERIES (BREAKPOINTS) --- */
    @media (max-width: 1400px) {
      .masonry-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 1100px) {
      .masonry-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .metrics-panel {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .masonry-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .metrics-panel {
        grid-template-columns: repeat(2, 1fr);
      }

      .app-container {
        padding: 40px 20px;
      }

      header h1 {
        font-size: 2.5rem;
      }
    }

    @media (max-width: 500px) {
      .masonry-grid {
        grid-template-columns: repeat(1, 1fr);
      }

      .metrics-panel {
        grid-template-columns: repeat(1, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- HTML -->
  <div class="app-container">
    <header>
      <h1>Nothing Note</h1>
      <p>A personal collection of ideas, reflections, notes, and random thoughts.</p>
    </header>

    <!-- METRICS SECTION -->
    <section class="metrics-panel" id="metricsPanel" aria-label="Brain Statistics">
      <div class="metric-card">
        <div class="metric-title">Total Thoughts</div>
        <div class="metric-value" id="statThoughts">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Categories</div>
        <div class="metric-value" id="statCategories">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Unique Tags</div>
        <div class="metric-value" id="statTags">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Newest Entry</div>
        <div class="metric-value" id="statNewest">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Oldest Entry</div>
        <div class="metric-value" id="statOldest">—</div>
      </div>
    </section>

    <!-- CONTROLS CONTAINER -->
    <div class="controls-wrapper">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search thoughts..." aria-label="Search thoughts real time">
      </div>
      <div class="filter-chips" id="filterChips" role="tablist" aria-label="Category filters">
        <span class="chip active" data-category="All" role="tab" aria-selected="true">All</span>
        <span class="chip" data-category="Life" role="tab" aria-selected="false">Life</span>
        <span class="chip" data-category="Programming" role="tab" aria-selected="false">Programming</span>
        <span class="chip" data-category="Oracle" role="tab" aria-selected="false">Oracle</span>
        <span class="chip" data-category="Linux" role="tab" aria-selected="false">Linux</span>
        <span class="chip" data-category="Career" role="tab" aria-selected="false">Career</span>
        <span class="chip" data-category="Ideas" role="tab" aria-selected="false">Ideas</span>
        <span class="chip" data-category="Daily" role="tab" aria-selected="false">Daily</span>
      </div>
    </div>

    <!-- MAIN GRID CONTAINER -->
    <main class="masonry-grid" id="masonryGrid">
      <!-- Target structural columns generated systematically at runtime -->
      <div class="empty-state" id="emptyState">
        <div class="empty-state-icon"></div>
        <h4>No thoughts found.</h4>
      </div>
    </main>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    // State Space
    let globalNotes = [];
    let currentCategory = "All";
    let searchQuery = "";

    const accentMap = {
      "life": "var(--accent-life)",
      "programming": "var(--accent-programming)",
      "oracle": "var(--accent-oracle)",
      "linux": "var(--accent-linux)",
      "career": "var(--accent-career)",
      "ideas": "var(--accent-ideas)",
      "daily": "var(--accent-daily)"
    };

    // Dom References
    const searchInput = document.getElementById("searchInput");
    const filterChips = document.getElementById("filterChips");
    const masonryGrid = document.getElementById("masonryGrid");
    const emptyState = document.getElementById("emptyState");

    // Initialize System Lifecycle
    document.addEventListener("DOMContentLoaded", initApp);

    async function initApp() {
      try {
        const response = await fetch("noted.json");
        if (!response.ok) throw new Error("Network schema profile payload unreadable.");
        globalNotes = await response.json();

        calculateMetrics(globalNotes);
        renderGrid();
        setupListeners();
      } catch (error) {
        console.error("Critical Failure Loading Second Brain Ecosystem Data Data:", error);
      }
    }

    // Dynamic Statistics Core Engine Calculation
    function calculateMetrics(notes) {
      if (!notes.length) return;

      document.getElementById("statThoughts").textContent = notes.length;

      const categories = new Set(notes.map(n => n.category));
      document.getElementById("statCategories").textContent = categories.size;

      const tags = new Set(notes.flatMap(n => n.tags));
      document.getElementById("statTags").textContent = tags.size;

      const sortedDates = [...notes]
        .map(n => n.date)
        .filter(Boolean)
        .sort((a, b) => new Date(a) - new Date(b));

      if (sortedDates.length) {
        document.getElementById("statOldest").textContent = formatDateLabel(sortedDates[0]);
        document.getElementById("statNewest").textContent = formatDateLabel(sortedDates[sortedDates.length - 1]);
      }
    }

    function formatDateLabel(dateStr) {
      const options = { month: 'short', day: 'numeric', year: 'numeric' };
      return new Date(dateStr).toLocaleDateString('en-US', options);
    }

    // Interactive Listener Bindings
    function setupListeners() {
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderGrid();
      });

      filterChips.addEventListener("click", (e) => {
        const targetChip = e.target.closest(".chip");
        if (!targetChip) return;

        document.querySelectorAll(".chip").forEach(c => {
          c.classList.remove("active");
          c.setAttribute("aria-selected", "false");
        });

        targetChip.classList.add("active");
        targetChip.setAttribute("aria-selected", "true");
        currentCategory = targetChip.getAttribute("data-category");
        renderGrid();
      });

      // Track re-calculations on resizing layout bounds dynamically
      window.addEventListener("resize", debounce(() => renderGrid(), 150));
    }

    // Calculate Column Configurations based on Dynamic Layout Sizes
    function getColumnCount() {
      const width = window.innerWidth;
      if (width > 1400) return 5;
      if (width > 1100) return 4;
      if (width > 768) return 3;
      if (width > 500) return 2;
      return 1;
    }

    // Fluid Filter & Render Core Engine
    function renderGrid() {
      // 1. Filtering Logic Pipeline
      const filtered = globalNotes.filter(note => {
        const matchesCategory = (currentCategory === "All" || note.category === currentCategory);
        const matchesSearch = !searchQuery ||
          note.title.toLowerCase().includes(searchQuery) ||
          note.content.toLowerCase().includes(searchQuery) ||
          note.category.toLowerCase().includes(searchQuery) ||
          note.tags.some(t => t.toLowerCase().includes(searchQuery));

        return matchesCategory && matchesSearch;
      });

      // Clear existing setup, saving only the empty state element node
      const colsCount = getColumnCount();
      masonryGrid.querySelectorAll(".masonry-col").forEach(col => col.remove());

      if (filtered.length === 0) {
        emptyState.style.display = "flex";
        return;
      }
      emptyState.style.display = "none";

      // 2. Initialize Structural Layout Tracks
      const colElements = [];
      for (let i = 0; i < colsCount; i++) {
        const col = document.createElement("div");
        col.className = "masonry-col";
        masonryGrid.appendChild(col);
        colElements.push(col);
      }

      // 3. Systematically Distribute Card Elements Evenly Across Columns
      filtered.forEach((note, index) => {
        const targetColIndex = index % colsCount;
        const card = createCardElement(note, index);
        colElements[targetColIndex].appendChild(card);

        // Staggered Micro-Animation Framework trigger via requestAnimationFrame
        requestAnimationFrame(() => {
          setTimeout(() => {
            card.classList.add("visible");
          }, index * 40);
        });
      });
    }

    // DOM Node Template Component Builder
    function createCardElement(note, index) {
      const card = document.createElement("article");
      card.className = "thought-card";
      card.setAttribute("tabindex", "0");

      const accentColor = accentMap[note.category.toLowerCase()] || "var(--text-muted)";
      card.style.setProperty("--cat-color", accentColor);
      card.style.setProperty("--card-border-glow", accentColor.replace(")", ", 0.25)"));

      const tagHtml = note.tags.map(t => `<span class="tag">#${t}</span>`).join("");

      card.innerHTML = `
        <div class="card-meta-top">
          <span class="category-badge">${note.category}</span>
          <span class="card-emoji" role="img" aria-label="thought icon">${note.emoji || '💭'}</span>
        </div>
        <h3>${escapeHtml(note.title)}</h3>
        <p>${escapeHtml(note.content)}</p>
        <div class="card-tags">${tagHtml}</div>
        <div class="card-date">${formatDateLabel(note.date)}</div>
      `;

      return card;
    }

    // Security sanitization utility for handling localized strings safely
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Layout Optimization Engine Helpers
    function debounce(func, wait) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }
  </script>
</body>

</html>
