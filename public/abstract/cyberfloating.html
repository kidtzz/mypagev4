<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Time Floating Words Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030106;
      /* Base fallback dipergelap */
      font-family: 'Consolas', 'Monaco', 'Roboto Mono', 'Courier New', Courier, monospace;
      font-weight: bold;
      transition: background-color 1s ease;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <canvas id="glitchCanvas"></canvas>

  <script>
    const canvas = document.getElementById('glitchCanvas');
    const ctx = canvas.getContext('2d');

    let words = [];
    let dataSource = { "texts": [] };
    let bgAngle = 0;

    const fontStack = "bold %fspx 'Consolas', 'Monaco', 'Roboto Mono', 'Courier New', monospace";
    const isMobile = window.innerWidth < 768;

    // Jumlah kata sedikit dikurangi agar tidak terlalu padat karena font membesar
    const maxWords = isMobile ? 15 : 26;

    const mouse = {
      x: null,
      y: null,
      radius: isMobile ? 70 : 120 // Radius dorongan sedikit diperbesar mengikuti ukuran font
    };

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    });
    window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Word {
      constructor(text, isInitial = false) {
        this.text = text;
        this.reset(isInitial);
      }

      reset(isInitial = false) {
        // FONT DIปรับ AGAK LEBIH BESAR: HP (12px - 16px) | Desktop (14px - 24px)
        const minFont = isMobile ? 12 : 14;
        const maxFont = isMobile ? 16 : 24;

        this.fontSize = Math.floor(Math.random() * (maxFont - minFont + 1)) + minFont;

        ctx.font = fontStack.replace('%fs', this.fontSize);
        this.width = ctx.measureText(this.text).width;
        this.height = this.fontSize;

        if (isInitial) {
          this.x = Math.random() * (canvas.width - this.width);
          this.y = Math.random() * (canvas.height - this.height) + this.height;
        } else {
          const side = Math.floor(Math.random() * 4);
          if (side === 0) {
            this.x = Math.random() * (canvas.width - this.width); this.y = -this.height;
          } else if (side === 1) {
            this.x = canvas.width + 30; this.y = Math.random() * (canvas.height - this.height) + this.height;
          } else if (side === 2) {
            this.x = Math.random() * (canvas.width - this.width); this.y = canvas.height + this.height + 30;
          } else {
            this.x = -this.width - 30; this.y = Math.random() * (canvas.height - this.height) + this.height;
          }
        }

        this.baseVx = (Math.random() - 0.5) * 0.45;
        this.baseVy = (Math.random() - 0.5) * 0.45;

        if (Math.abs(this.baseVx) < 0.08) this.baseVx = this.baseVx < 0 ? -0.12 : 0.12;
        if (Math.abs(this.baseVy) < 0.08) this.baseVy = this.baseVy < 0 ? -0.12 : 0.12;

        this.vx = this.baseVx; this.vy = this.baseVy;
        this.opacity = Math.random() * (0.65 - 0.25) + 0.25;
      }

      update() {
        if (mouse.x !== null && mouse.y !== null) {
          const textCenterX = this.x + this.width / 2;
          const textCenterY = this.y - this.height / 2;
          const dx = textCenterX - mouse.x;
          const dy = textCenterY - mouse.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < mouse.radius) {
            const force = (mouse.radius - distance) / mouse.radius;
            const angle = Math.atan2(dy, dx);
            const pushSpeed = isMobile ? 2.2 : 3.8;
            this.vx += Math.cos(angle) * force * pushSpeed;
            this.vy += Math.sin(angle) * force * pushSpeed;
          }
        }

        this.vx += (this.baseVx - this.vx) * 0.08;
        this.vy += (this.baseVy - this.vy) * 0.08;
        this.x += this.vx; this.y += this.vy;

        if (this.x < -this.width - 150 || this.x > canvas.width + 150 || this.y < -this.height - 150 || this.y > canvas.height + 150) {
          if (dataSource.texts.length > 0) {
            const randomIndex = Math.floor(Math.random() * dataSource.texts.length);
            this.text = dataSource.texts[randomIndex];
          }
          this.reset(false);
        }
      }

      draw() {
        ctx.save();
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.font = fontStack.replace('%fs', this.fontSize);
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    // WARNA GRADASI DIBUAT JAUH LEBIH GELAP & DEEP
    function drawDynamicBackground() {
      bgAngle += 0.0012;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = Math.max(canvas.width, canvas.height) / 1.5;

      const x1 = cx + Math.cos(bgAngle) * r;
      const y1 = cy + Math.sin(bgAngle) * r;
      const x2 = cx - Math.cos(bgAngle) * r;
      const y2 = cy - Math.sin(bgAngle) * r;

      const gradient = ctx.createLinearGradient(x1, y1, x2, y2);

      const currentHour = new Date().getHours();

      if (currentHour >= 4 && currentHour < 6) {
        // 1. SUBUH / FAJAR - Dimmed down fajar hangat
        gradient.addColorStop(0, '#030106');
        gradient.addColorStop(0.4, '#0f0a1c');
        gradient.addColorStop(0.75, '#261020');
        gradient.addColorStop(0.95, '#381822');
        gradient.addColorStop(1, '#030106');
      }
      else if (currentHour >= 6 && currentHour < 16) {
        // 2. SIANG / PAGI - Deep Navy berkelas (kontras tinggi untuk teks siang hari)
        gradient.addColorStop(0, '#040a15');
        gradient.addColorStop(0.35, '#0b1424');
        gradient.addColorStop(0.7, '#12243b');
        gradient.addColorStop(0.92, '#1b3754');
        gradient.addColorStop(1, '#040a15');
      }
      else if (currentHour >= 16 && currentHour < 19) {
        // 3. SORE / SENJA - Twilight yang dipergelap (agak redup tapi warna senja tetap samar terasa)
        gradient.addColorStop(0, '#05030a');
        gradient.addColorStop(0.35, '#0d101d');
        gradient.addColorStop(0.7, '#1b122b');
        gradient.addColorStop(0.92, '#2b191c');
        gradient.addColorStop(1, '#05030a');
      }
      else {
        // 4. MALAM / MIDNIGHT - Berubah jadi ultra-dark cyber mode
        gradient.addColorStop(0, '#010003');
        gradient.addColorStop(0.35, '#02040a');
        gradient.addColorStop(0.7, '#06030b');
        gradient.addColorStop(0.92, '#0a0405');
        gradient.addColorStop(1, '#010003');
      }

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function init() {
      words = [];
      const textArray = dataSource.texts;
      if (textArray.length === 0) return;

      for (let i = 0; i < maxWords; i++) {
        const randomText = textArray[Math.floor(Math.random() * textArray.length)];
        words.push(new Word(randomText, true));
      }
    }

    function animate() {
      drawDynamicBackground();

      for (let i = 0; i < words.length; i++) {
        words[i].update();
        words[i].draw();
      }

      requestAnimationFrame(animate);
    }

    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        dataSource = data;
        init();
        animate();
      })
      .catch(error => {
        console.error('Gagal memuat data.json:', error);
        dataSource = { "texts": ["SYSTEM ERROR", "RETRYING..."] };
        init();
        animate();
      });
  </script>
</body>

</html>
