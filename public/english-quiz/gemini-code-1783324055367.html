<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global English Placement Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>

<body class="bg-white text-slate-800 dark:bg-slate-900 dark:text-slate-200 font-sans min-h-screen antialiased transition-colors duration-200">

    <!-- Simple Navigation Bar -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <h1 class="text-base font-bold text-slate-900 dark:text-white">YAS KIDTZ</h1>
                <span class="text-xs text-slate-400">| Placement Test</span>
            </div>

            <div class="flex items-center space-x-4">
                <button onclick="toggleThemeMode()" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                    <i data-lucide="sun" id="themeIconSun" class="w-4 h-4 hidden"></i>
                    <i data-lucide="moon" id="themeIconMoon" class="w-4 h-4"></i>
                </button>

                <div id="topNavStats" class="flex items-center space-x-3 text-xs">
                    <span id="navProgressText" class="font-medium text-slate-500">0 / 0 Completed</span>
                    <div class="w-20 bg-slate-100 dark:bg-slate-800 rounded-full h-1.5 overflow-hidden">
                        <div id="navProgressBar" class="bg-indigo-600 h-1.5 rounded-full transition-all" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- VIEW 1: WELCOME / LANDING DASHBOARD -->
        <div id="welcomeView" class="hidden"></div>

        <!-- VIEW 2: EXAM INTERFACE -->
        <div id="examView" class="hidden space-y-6">
            
            <!-- Questions List -->
            <div id="questionsContainer" class="space-y-4">
                <!-- Populated programmatically -->
            </div>

            <!-- Simple Pagination and Form Controls -->
            <div class="flex justify-between items-center pt-4 border-t border-slate-200 dark:border-slate-800">
                <button id="prevPageBtn" onclick="navigatePage(-1)" class="border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-1 disabled:opacity-30">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    <span>Previous</span>
                </button>
                
                <span id="pageIndicatorBadge" class="text-xs font-medium text-slate-500">Page 1 of 1</span>
                
                <button id="nextPageBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-1">
                    <span>Next</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Minimalist Matrix Map Map -->
            <div class="p-4 border border-slate-200 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-900/50">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Question Map</h3>
                    <button onclick="clearCurrentProgress()" class="text-xs text-rose-500 hover:underline flex items-center space-x-1">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                        <span>Reset</span>
                    </button>
                </div>
                <div id="questionGridMap" class="flex flex-wrap gap-1.5">
                    <!-- Generated programmatically -->
                </div>
            </div>
        </div>

        <!-- VIEW 3: REPORT DASHBOARD -->
        <div id="reportView" class="hidden space-y-6 max-w-2xl mx-auto">
            <div class="border border-slate-200 dark:border-slate-800 rounded-xl p-6 text-center bg-slate-50 dark:bg-slate-900/50">
                <span class="text-xs font-bold tracking-widest text-slate-400 uppercase">Your Result</span>
                <h2 id="displayCompositeScore" class="text-5xl font-black text-indigo-600 dark:text-indigo-400 my-2">0%</h2>
                <p id="displayCorrectRatio" class="text-sm text-slate-600 dark:text-slate-400">0 dari 0 Correct</p>
                <p id="certDateStamp" class="text-xs text-slate-400 mt-2">Date</p>
            </div>

            <!-- Actions Dashboard -->
            <div class="flex gap-3">
                <button onclick="restartExam()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition">
                    Restart Quiz
                </button>
                <button onclick="goBackToQuizList()" class="flex-1 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-medium py-2 px-4 rounded-lg text-sm transition hover:bg-slate-50 dark:hover:bg-slate-800">
                    Back to List
                </button>
            </div>

            <!-- Itemized Evaluation Matrix Review -->
            <div class="space-y-3 pt-4 border-t border-slate-200 dark:border-slate-800">
                <h3 class="text-sm font-bold text-slate-900 dark:text-white">Review Details</h3>
                <div id="reviewMatrixContainer" class="space-y-3">
                    <!-- Populated programmatically -->
                </div>
            </div>
        </div>

    </main>

    <script>
        let MASTER_QUESTION_BANK = [];
        let randomizedQuestionsOrder = [];
        let userResponsesMatrix = {};

        let currentPageIndex = 0;
        const QUESTIONS_PER_PAGE = 10;

        function toggleThemeMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.getElementById('themeIconSun').classList.toggle('hidden', !isDark);
            document.getElementById('themeIconMoon').classList.toggle('hidden', isDark);
            localStorage.setItem('themePreference', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('themePreference') === 'dark') {
            document.documentElement.classList.add('dark');
            window.addEventListener('DOMContentLoaded', () => {
                document.getElementById('themeIconSun').classList.remove('hidden');
                document.getElementById('themeIconMoon').classList.add('hidden');
            });
        }

        async function loadQuestionBank() {
            const params = new URLSearchParams(window.location.search);
            const quizId = params.get('quiz') || 'ap1';
            const response = await fetch(`/english-quiz/data/${quizId}.json`);
            const data = await response.json();
            MASTER_QUESTION_BANK = data.questions;
            initializeSystemExamState();
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadQuestionBank();
        });

        function initializeSystemExamState() {
            startExam();
        }

        function startExam() {
            let tempArray = [...MASTER_QUESTION_BANK];

            for (let i = tempArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tempArray[i], tempArray[j]] = [tempArray[j], tempArray[i]];
            }

            randomizedQuestionsOrder = tempArray;
            userResponsesMatrix = {};
            currentPageIndex = 0;

            showExamInterfaceView();
        }

        function showView(viewId) {
            ['welcomeView', 'examView', 'reportView'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function showExamInterfaceView() {
            showView('examView');
            document.getElementById('topNavStats').classList.remove('hidden');
            renderQuestionsPageBlock();
            loadInteractiveGridMap();
        }

        function updateGlobalProgressTrackers() {
            const answeredCount = Object.keys(userResponsesMatrix).length;
            const percentage = (answeredCount / MASTER_QUESTION_BANK.length) * 100;

            document.getElementById('navProgressText').innerText = `${answeredCount} / ${MASTER_QUESTION_BANK.length} Completed`;
            document.getElementById('navProgressBar').style.width = `${percentage}%`;
        }

        function loadInteractiveGridMap() {
            const mapContainer = document.getElementById('questionGridMap');
            mapContainer.innerHTML = '';

            randomizedQuestionsOrder.forEach((question, index) => {
                const mapCell = document.createElement('button');
                mapCell.innerText = (index + 1).toString();
                mapCell.className = `h-8 w-8 text-xs font-mono rounded-md transition border flex items-center justify-center`;

                const isAnswered = userResponsesMatrix[question.id] !== undefined;

                if (isAnswered) {
                    mapCell.className += ' bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 border-indigo-200 dark:border-indigo-800 font-bold';
                } else {
                    mapCell.className += ' bg-white dark:bg-slate-800 text-slate-400 dark:text-slate-500 border-slate-200 dark:border-slate-700 hover:bg-slate-50';
                }

                mapCell.onclick = () => { jumpToQuestionItemIndex(index); };
                mapContainer.appendChild(mapCell);
            });
        }

        function renderQuestionsPageBlock() {
            if (randomizedQuestionsOrder.length === 0) return;

            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const startIndex = currentPageIndex * QUESTIONS_PER_PAGE;
            const endIndex = Math.min(startIndex + QUESTIONS_PER_PAGE, randomizedQuestionsOrder.length);
            const activePageQuestions = randomizedQuestionsOrder.slice(startIndex, endIndex);

            activePageQuestions.forEach((question, subIndex) => {
                const globalIndex = startIndex + subIndex;
                let extraContent = '';

                if (question.passage) {
                    extraContent += `
                        <div class="mb-3 p-3 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm leading-relaxed text-slate-600 dark:text-slate-400 whitespace-pre-line">
                            ${question.passage}
                        </div>
                    `;
                }

                if (question.audio) {
                    extraContent += `
                        <div class="mb-3">
                            <audio controls class="w-full h-8 text-xs">
                                <source src="${question.audio}" type="audio/mpeg">
                            </audio>
                        </div>
                    `;
                }

                const questionCard = document.createElement('div');
                questionCard.id = `q-card-item-${globalIndex}`;
                questionCard.className = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 transition-colors duration-200";

                questionCard.innerHTML = `
                    <div class="flex items-center justify-between pb-2 mb-3 border-b border-slate-100 dark:border-slate-800 text-xs">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-slate-400">Question ${globalIndex + 1}</span>
                            <span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 font-medium">${question.type}</span>
                        </div>
                    </div>
                    <div class="mb-4">
                       ${extraContent}
                        <p class="text-sm font-medium text-slate-900 dark:text-white leading-relaxed">${question.text}</p>
                    </div>
                    <div id="options-box-wrapper-${question.id}" class="space-y-2"></div>
                `;

                container.appendChild(questionCard);
                const optionsBox = document.getElementById(`options-box-wrapper-${question.id}`);

                question.options.forEach(option => {
                    const isSelected = userResponsesMatrix[question.id] === option;
                    const optionLabel = document.createElement('label');
                    optionLabel.className = `flex items-center p-3 rounded-lg border transition cursor-pointer text-xs font-medium select-none ${isSelected
                        ? 'border-indigo-500 bg-indigo-50/50 dark:bg-indigo-950/30 text-indigo-900 dark:text-indigo-300'
                        : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/30'
                        }`;

                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `radio_group_choice_${question.id}`;
                    radio.value = option;
                    radio.checked = isSelected;
                    radio.className = 'w-3.5 h-3.5 text-indigo-600 border-slate-300 mr-2 accent-indigo-600';
                    radio.onchange = () => { selectOptionChoiceValue(question.id, option); };

                    optionLabel.appendChild(radio);
                    const labelText = document.createElement('span');
                    labelText.innerText = option;
                    optionLabel.appendChild(labelText);
                    optionsBox.appendChild(optionLabel);
                });
            });

            const totalPages = Math.ceil(randomizedQuestionsOrder.length / QUESTIONS_PER_PAGE);
            document.getElementById('pageIndicatorBadge').innerText = `Page ${currentPageIndex + 1} of ${totalPages}`;
            document.getElementById('prevPageBtn').disabled = currentPageIndex === 0;

            const nextBtn = document.getElementById('nextPageBtn');
            if (currentPageIndex === totalPages - 1) {
                nextBtn.innerHTML = `<span>Submit</span><i data-lucide="check" class="w-4 h-4"></i>`;
                nextBtn.className = "bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-1";
                nextBtn.onclick = calculateFinalMetrics;
            } else {
                nextBtn.innerHTML = `<span>Next</span><i data-lucide="chevron-right" class="w-4 h-4"></i>`;
                nextBtn.className = "bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-1";
                nextBtn.onclick = () => { navigatePage(1); };
            }

            lucide.createIcons();
        }

        function selectOptionChoiceValue(questionId, selectedValue) {
            userResponsesMatrix[questionId] = selectedValue;
            updateGlobalProgressTrackers();
            loadInteractiveGridMap();
        }

        function navigatePage(directionOffset) {
            const totalPages = Math.ceil(randomizedQuestionsOrder.length / QUESTIONS_PER_PAGE);
            const targetPage = currentPageIndex + directionOffset;

            if (targetPage >= 0 && targetPage < totalPages) {
                currentPageIndex = targetPage;
                renderQuestionsPageBlock();
                loadInteractiveGridMap();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToQuestionItemIndex(targetGlobalIndex) {
            const targetPage = Math.floor(targetGlobalIndex / QUESTIONS_PER_PAGE);

            if (currentPageIndex !== targetPage) {
                currentPageIndex = targetPage;
                renderQuestionsPageBlock();
                loadInteractiveGridMap();
            }

            setTimeout(() => {
                const element = document.getElementById(`q-card-item-${targetGlobalIndex}`);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    element.classList.add('border-indigo-500', 'dark:border-indigo-400');
                    setTimeout(() => {
                        element.classList.remove('border-indigo-500', 'dark:border-indigo-400');
                    }, 1500);
                }
            }, 100);
        }

        function clearCurrentProgress() {
            if (confirm("Are you certain you want to clear your answers? This will reset all your current progress.")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        function calculateFinalMetrics() {
            const totalAnswered = Object.keys(userResponsesMatrix).length;
            if (totalAnswered < MASTER_QUESTION_BANK.length) {
                if (!confirm(`Warning: You have only answered ${totalAnswered} out of ${MASTER_QUESTION_BANK.length} questions. Unanswered questions count as incorrect. Do you want to submit anyway?`)) {
                    return;
                }
            }

            let aggregateScore = 0;
            MASTER_QUESTION_BANK.forEach(item => {
                if (userResponsesMatrix[item.id] === item.answer) {
                    aggregateScore++;
                }
            });

            const totalQuestions = MASTER_QUESTION_BANK.length;
            const finalPercentage = Math.round((aggregateScore / totalQuestions) * 100);

            document.getElementById('displayCompositeScore').innerText = `${finalPercentage}%`;
            document.getElementById('displayCorrectRatio').innerText = `${aggregateScore} dari ${totalQuestions} Jawaban Benar`;

            const liveDate = new Date();
            document.getElementById('certDateStamp').innerText = liveDate.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

            generateItemizedReviewMatrixLayout();

            showView('reportView');
            document.getElementById('topNavStats').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            localStorage.clear();
        }

        function generateItemizedReviewMatrixLayout() {
            const container = document.getElementById('reviewMatrixContainer');
            container.innerHTML = '';

            randomizedQuestionsOrder.forEach((item, idx) => {
                const userChoice = userResponsesMatrix[item.id] || "[No Option Answered Selected]";
                const isCorrect = userChoice === item.answer;

                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border text-xs ${isCorrect
                    ? 'bg-emerald-50/20 border-emerald-200 dark:border-emerald-900/40'
                    : 'bg-rose-50/20 border-rose-200 dark:border-rose-900/40'
                    }`;

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="font-bold text-slate-400">No. ${idx + 1}</span>
                        <span class="font-bold ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">
                            ${isCorrect ? 'Correct' : 'Incorrect'}
                        </span>
                    </div>
                    <p class="font-medium text-slate-800 dark:text-white mb-2">${item.text}</p>
                    <div class="space-y-1 text-[11px]">
                        <div><span class="text-slate-400">Your Answer:</span> <span class="font-mono font-semibold">${userChoice}</span></div>
                        <div><span class="text-slate-400">Correct Answer:</span> <span class="font-mono font-semibold text-emerald-600">${item.answer}</span></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function restartExam() {
            if (!confirm('Are you sure you want to restart this quiz?')) {
                return;
            }
            Object.keys(localStorage).forEach(key => {
                if (key.includes('exam_')) {
                    localStorage.removeItem(key);
                }
            });
            location.reload();
        }

        function goBackToQuizList() {
            window.location.href = '/arts/english-quiz/';
        }
    </script>
</body>

</html>
