<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global English Placement Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>

<body
    class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 font-sans min-h-screen antialiased transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <header
        class="bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 sticky top-0 z-40 shadow-sm transition-colors duration-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md shadow-indigo-100 dark:shadow-none">
                    <i data-lucide="award" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-md font-bold text-slate-900 dark:text-white tracking-tight leading-none">YAS KIDTZ
                    </h1>
                    <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1 font-medium">CEFR Placement Test</p>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <!-- Theme Toggle Button -->
                <button onclick="toggleThemeMode()"
                    class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition"
                    title="Toggle Appearance">
                    <i data-lucide="sun" id="themeIconSun" class="w-4 h-4 hidden"></i>
                    <i data-lucide="moon" id="themeIconMoon" class="w-4 h-4"></i>
                </button>

                <div id="topNavStats" class="flex items-center space-x-4">
                    <div class="text-right hidden sm:block">
                        <p id="navProgressText" class="text-xs font-semibold text-slate-600 dark:text-slate-400">0 / 50
                            Completed
                        </p>
                    </div>
                    <div class="w-24 bg-slate-100 dark:bg-slate-800 rounded-full h-2 overflow-hidden">
                        <div id="navProgressBar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300"
                            style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 md:py-10">

        <!-- VIEW 1: WELCOME / LANDING DASHBOARD -->
        <div id="welcomeView" class="hidden"></div>

        <!-- VIEW 2: EXAM INTERFACE -->
        <div id="examView" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 items-start">

            <!-- Left Column: 10 Questions Container List -->
            <div class="lg:col-span-2 space-y-6">
                <div id="questionsContainer" class="space-y-6">
                    <!-- Populated programmatically -->
                </div>

                <!-- Page Footer Control Navigations -->
                <div
                    class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 md:p-6 shadow-sm flex justify-between items-center gap-4 transition-colors duration-200">
                    <button id="prevPageBtn" onclick="navigatePage(-1)"
                        class="border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 font-semibold px-4 py-2.5 rounded-xl transition flex items-center space-x-2 disabled:opacity-40 disabled:hover:bg-white dark:disabled:hover:bg-slate-900 text-sm">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        <span>Previous Page</span>
                    </button>
                    <span id="pageIndicatorBadge" class="text-xs font-bold text-slate-500 dark:text-slate-400">Page 1 of
                        5</span>
                    <button id="nextPageBtn" onclick="navigatePage(1)"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl transition flex items-center space-x-2 text-sm shadow-md shadow-indigo-100 dark:shadow-none">
                        <span>Next Page</span>
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Right Column: Exam Status & Navigation Grid Map -->
            <div class="space-y-6 lg:sticky lg:top-24">
                <div
                    class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 md:p-6 shadow-sm space-y-6 transition-colors duration-200">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-slate-900 dark:text-white text-sm tracking-tight mb-1">Matrix Map
                                Index</h3>
                            <p class="text-xs text-slate-400 dark:text-slate-500">Jump directly to any specific question
                                item.</p>
                        </div>
                        <button onclick="clearCurrentProgress()"
                            class="text-[11px] text-rose-500 hover:text-rose-700 font-medium flex items-center space-x-1 transition mt-0.5">
                            <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                            <span>Reset Board</span>
                        </button>
                    </div>

                    <div id="questionGridMap"
                        class="grid grid-cols-5 gap-2 text-center max-h-[220px] overflow-y-auto pr-1">
                        <!-- Generated programmatically -->
                    </div>

                    <div class="border-t border-slate-100 dark:border-slate-800 pt-5">
                        <button onclick="calculateFinalMetrics()"
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-emerald-100 dark:shadow-none transition duration-150 flex items-center justify-center space-x-2 text-sm">
                            <i data-lucide="check-circle" class="w-4 h-4"></i>
                            <span>Complete & Submit Test</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW 3: REPORT DASHBOARD & PERFORMANCE METRICS -->
        <div id="reportView" class="hidden space-y-6 md:space-y-8">

            <!-- Global English Dashboard Score Badge Header -->
            <div
                class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 md:p-8 shadow-sm transition-colors duration-200 max-w-md mx-auto">
                <div
                    class="flex flex-col items-center justify-center text-center p-6 bg-indigo-50/50 dark:bg-indigo-950/30 border border-indigo-100/70 dark:border-indigo-900/50 rounded-2xl">
                    <span
                        class="text-xs font-bold tracking-widest text-indigo-600 dark:text-indigo-400 uppercase mb-2">ENGLISH
                        EXAM SCORE</span>
                    <h2 id="displayCompositeScore"
                        class="text-6xl font-black text-slate-900 dark:text-white tracking-tight">0%
                    </h2>
                    <p id="displayCorrectRatio"
                        class="text-sm font-semibold text-slate-500 dark:text-slate-400 mt-3 bg-white dark:bg-slate-900 px-4 py-1.5 rounded-full border border-slate-150 dark:border-slate-800">
                        0 dari 0 Benar</p>
                    <p id="certDateStamp" class="text-[11px] font-medium text-slate-400 dark:text-slate-500 mt-4">June
                        21, 2026
                    </p>
                </div>
            </div>

            <!-- Layout Utama Hasil Setelah Submit -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Actions Dashboard Panel -->
                <div class="lg:col-span-1 space-y-4 lg:sticky lg:top-24 h-fit">
                    <div
                        class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 md:p-6 rounded-2xl shadow-sm space-y-4 transition-colors duration-200">
                        <h4 class="font-bold text-slate-900 dark:text-white text-base flex items-center space-x-2">
                            <i data-lucide="sliders" class="w-4 h-4 text-indigo-600 dark:text-indigo-400"></i>
                            <span>Actions Dashboard</span>
                        </h4>

                        <button onclick="restartExam()"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 text-sm shadow transition">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            <span>Restart Quiz</span>
                        </button>

                        <button onclick="goBackToQuizList()"
                            class="w-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 text-sm transition">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i>
                            <span>Back to Quiz List</span>
                        </button>
                    </div>
                </div>

                <!-- Itemized Evaluation Matrix Review -->
                <div
                    class="lg:col-span-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 md:p-6 shadow-sm space-y-4 transition-colors duration-200">
                    <h3 class="font-bold text-slate-900 dark:text-white text-base flex items-center space-x-2">
                        <i data-lucide="clipboard-check" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
                        <span>Itemized Evaluation Matrix Review</span>
                    </h3>
                    <div id="reviewMatrixContainer" class="space-y-4 max-h-[75vh] overflow-y-auto pr-1">
                        <!-- Populated programmatically -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- EXAM LOGIC ENGINE CODE INTERPRETER SCRIPT -->
    <script>
        let MASTER_QUESTION_BANK = [];
        let randomizedQuestionsOrder = [];
        let userResponsesMatrix = {};

        let currentPageIndex = 0;
        const QUESTIONS_PER_PAGE = 10;

        function toggleThemeMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.getElementById('themeIconSun').classList.toggle('hidden', !isDark);
            document.getElementById('themeIconMoon').classList.toggle('hidden', isDark);
            localStorage.setItem('themePreference', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('themePreference') === 'dark') {
            document.documentElement.classList.add('dark');
            window.addEventListener('DOMContentLoaded', () => {
                document.getElementById('themeIconSun').classList.remove('hidden');
                document.getElementById('themeIconMoon').classList.add('hidden');
            });
        }

        async function loadQuestionBank() {
            const params = new URLSearchParams(window.location.search);
            const quizId = params.get('quiz') || 'ap1';
            const response = await fetch(`/english-quiz/data/${quizId}.json`);
            const data = await response.json();
            MASTER_QUESTION_BANK = data.questions;
            initializeSystemExamState();
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadQuestionBank();
        });

        function initializeSystemExamState() {
            startExam();
        }

        function startExam() {
            let tempArray = [...MASTER_QUESTION_BANK];

            for (let i = tempArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tempArray[i], tempArray[j]] = [tempArray[j], tempArray[i]];
            }

            randomizedQuestionsOrder = tempArray;
            userResponsesMatrix = {};
            currentPageIndex = 0;

            showExamInterfaceView();
        }

        function showView(viewId) {
            ['welcomeView', 'examView', 'reportView'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function showExamInterfaceView() {
            showView('examView');
            document.getElementById('topNavStats').classList.remove('hidden');
            renderQuestionsPageBlock();
            loadInteractiveGridMap();
        }

        function updateGlobalProgressTrackers() {
            const answeredCount = Object.keys(userResponsesMatrix).length;
            const percentage = (answeredCount / MASTER_QUESTION_BANK.length) * 100;

            document.getElementById('navProgressText').innerText = `${answeredCount} / ${MASTER_QUESTION_BANK.length} Completed`;
            document.getElementById('navProgressBar').style.width = `${percentage}%`;
        }

        function loadInteractiveGridMap() {
            const mapContainer = document.getElementById('questionGridMap');
            mapContainer.innerHTML = '';

            randomizedQuestionsOrder.forEach((question, index) => {
                const mapCell = document.createElement('button');
                mapCell.innerText = (index + 1).toString();
                mapCell.className = `p-2 text-xs font-mono font-bold rounded-xl transition border duration-150 h-9 w-9 flex items-center justify-center mx-auto`;

                const startRange = currentPageIndex * QUESTIONS_PER_PAGE;
                const endRange = startRange + QUESTIONS_PER_PAGE;
                const isCurrentPage = index >= startRange && index < endRange;
                const isAnswered = userResponsesMatrix[question.id] !== undefined;

                if (isAnswered) {
                    mapCell.className += ' bg-orange-100 dark:bg-orange-950/40 text-orange-700 dark:text-orange-300 border-orange-300 dark:border-orange-700 font-bold';
                } else {
                    mapCell.className += ' bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700/80';
                }

                mapCell.onclick = () => { jumpToQuestionItemIndex(index); };
                mapContainer.appendChild(mapCell);
            });
        }

        function renderQuestionsPageBlock() {
            if (randomizedQuestionsOrder.length === 0) return;

            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const startIndex = currentPageIndex * QUESTIONS_PER_PAGE;
            const endIndex = Math.min(startIndex + QUESTIONS_PER_PAGE, randomizedQuestionsOrder.length);
            const activePageQuestions = randomizedQuestionsOrder.slice(startIndex, endIndex);

            activePageQuestions.forEach((question, subIndex) => {
                const globalIndex = startIndex + subIndex;

                let extraContent = '';

                // Reading Passage
                if (question.passage) {
                    extraContent += `
        <div class="mb-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
            <p class="text-sm leading-relaxed whitespace-pre-line text-slate-700 dark:text-slate-300">
                ${question.passage}
            </p>
        </div>
    `;
                }

                // Listening Audio (untuk nanti)
                if (question.audio) {
                    extraContent += `
        <div class="mb-4">
            <audio controls class="w-full">
                <source src="${question.audio}" type="audio/mpeg">
                Your browser does not support audio playback.
            </audio>
        </div>
    `;
                }


                const questionCard = document.createElement('div');
                questionCard.id = `q-card-item-${globalIndex}`;
                questionCard.className = "bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 md:p-8 shadow-sm relative transition-colors duration-200";

                questionCard.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4 mb-6">
                        <div class="flex items-center space-x-2">
                            <span class="text-[11px] uppercase font-bold tracking-wider px-2.5 py-1 rounded-md bg-indigo-600 text-white">Question ${globalIndex + 1}</span>
                            <span class="text-[11px] uppercase font-bold tracking-wider px-2.5 py-1 rounded-md bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-400">${question.type}</span>
                        </div>
                        <span class="text-xs font-medium text-slate-400 dark:text-slate-500">Item ${globalIndex + 1} of ${randomizedQuestionsOrder.length}</span>
                    </div>
                    <div class="mb-6">
                       ${extraContent}
                        <p class="text-base md:text-lg font-semibold text-slate-900 dark:text-white leading-relaxed">${question.text}</p>
                    </div>
                    <div id="options-box-wrapper-${question.id}" class="space-y-3"></div>
                `;

                container.appendChild(questionCard);
                const optionsBox = document.getElementById(`options-box-wrapper-${question.id}`);

                question.options.forEach(option => {
                    const isSelected = userResponsesMatrix[question.id] === option;
                    const optionLabel = document.createElement('label');
                    optionLabel.className = `flex items-center p-4 rounded-xl border transition cursor-pointer text-sm font-semibold select-none ${isSelected
                        ? 'border-indigo-600 dark:border-indigo-500 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-950 dark:text-indigo-200 shadow-sm ring-1 ring-indigo-600'
                        : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50/80 dark:hover:bg-slate-700/50 hover:border-slate-300 dark:hover:border-slate-600'
                        }`;

                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `radio_group_choice_${question.id}`;
                    radio.value = option;
                    radio.checked = isSelected;
                    radio.className = 'w-4 h-4 text-indigo-600 border-slate-300 dark:border-slate-700 focus:ring-indigo-500 mr-3 accent-indigo-600';
                    radio.onchange = () => { selectOptionChoiceValue(question.id, option); };

                    optionLabel.appendChild(radio);
                    const labelText = document.createElement('span');
                    labelText.innerText = option;
                    optionLabel.appendChild(labelText);
                    optionsBox.appendChild(optionLabel);
                });
            });

            const totalPages = Math.ceil(randomizedQuestionsOrder.length / QUESTIONS_PER_PAGE);
            document.getElementById('pageIndicatorBadge').innerText = `Page ${currentPageIndex + 1} of ${totalPages}`;
            document.getElementById('prevPageBtn').disabled = currentPageIndex === 0;

            const nextBtn = document.getElementById('nextPageBtn');
            if (currentPageIndex === totalPages - 1) {
                nextBtn.innerHTML = `<span>Submit Matrix</span><i data-lucide="check" class="w-4 h-4"></i>`;
                nextBtn.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2.5 rounded-xl transition flex items-center space-x-2 text-sm shadow-md shadow-emerald-100 dark:shadow-none";
                nextBtn.onclick = calculateFinalMetrics;
            } else {
                nextBtn.innerHTML = `<span>Next Page</span><i data-lucide="chevron-right" class="w-4 h-4"></i>`;
                nextBtn.className = "bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl transition flex items-center space-x-2 text-sm shadow-md shadow-indigo-100 dark:shadow-none";
                nextBtn.onclick = () => { navigatePage(1); };
            }

            lucide.createIcons();
        }

        function selectOptionChoiceValue(questionId, selectedValue) {
            userResponsesMatrix[questionId] = selectedValue;
            updateGlobalProgressTrackers();
            loadInteractiveGridMap();
        }

        function navigatePage(directionOffset) {
            const totalPages = Math.ceil(randomizedQuestionsOrder.length / QUESTIONS_PER_PAGE);
            const targetPage = currentPageIndex + directionOffset;

            if (targetPage >= 0 && targetPage < totalPages) {
                currentPageIndex = targetPage;
                renderQuestionsPageBlock();
                loadInteractiveGridMap();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToQuestionItemIndex(targetGlobalIndex) {
            const targetPage = Math.floor(targetGlobalIndex / QUESTIONS_PER_PAGE);

            if (currentPageIndex !== targetPage) {
                currentPageIndex = targetPage;
                renderQuestionsPageBlock();
                loadInteractiveGridMap();
            }

            setTimeout(() => {
                const element = document.getElementById(`q-card-item-${targetGlobalIndex}`);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    element.classList.add('ring-2', 'ring-indigo-500', 'dark:ring-indigo-400');
                    setTimeout(() => {
                        element.classList.remove('ring-2', 'ring-indigo-500', 'dark:ring-indigo-400');
                    }, 2000);
                }
            }, 100);
        }

        function clearCurrentProgress() {
            if (confirm("Are you certain you want to clear your answers? This will reset all your current progress.")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        function calculateFinalMetrics() {
            const totalAnswered = Object.keys(userResponsesMatrix).length;
            if (totalAnswered < MASTER_QUESTION_BANK.length) {
                if (!confirm(`Warning: You have only answered ${totalAnswered} out of ${MASTER_QUESTION_BANK.length} questions. Unanswered questions count as incorrect. Do you want to submit anyway?`)) {
                    return;
                }
            }

            let aggregateScore = 0;
            MASTER_QUESTION_BANK.forEach(item => {
                if (userResponsesMatrix[item.id] === item.answer) {
                    aggregateScore++;
                }
            });

            // Calculate percentage & format indicators
            const totalQuestions = MASTER_QUESTION_BANK.length;
            const finalPercentage = Math.round((aggregateScore / totalQuestions) * 100);

            document.getElementById('displayCompositeScore').innerText = `${finalPercentage}%`;
            document.getElementById('displayCorrectRatio').innerText = `${aggregateScore} dari ${totalQuestions} Jawaban Benar`;

            const liveDate = new Date();
            document.getElementById('certDateStamp').innerText = liveDate.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

            generateItemizedReviewMatrixLayout();

            showView('reportView');
            document.getElementById('topNavStats').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            localStorage.clear();
        }

        function generateItemizedReviewMatrixLayout() {
            const container = document.getElementById('reviewMatrixContainer');
            container.innerHTML = '';

            randomizedQuestionsOrder.forEach((item, idx) => {
                const userChoice = userResponsesMatrix[item.id] || "[No Option Answered Selected]";
                const isCorrect = userChoice === item.answer;

                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border text-sm transition duration-150 ${isCorrect
                    ? 'bg-emerald-50/40 dark:bg-emerald-950/20 border-emerald-100 dark:border-emerald-900/60'
                    : 'bg-rose-50/40 dark:bg-rose-950/20 border-rose-100 dark:border-rose-900/60'
                    }`;

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2 gap-2">
                        <span class="text-[11px] font-mono uppercase font-bold tracking-wider px-2 py-0.5 rounded-md bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300">No. ${idx + 1}</span>
                        <span class="flex items-center space-x-1 font-bold ${isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-rose-700 dark:text-rose-400'}">
                            <i data-lucide="${isCorrect ? 'check-circle-2' : 'x-circle'}" class="w-3.5 h-3.5"></i>
                            <span class="text-[10px] uppercase tracking-wide">${isCorrect ? 'Correct' : 'Incorrect'}</span>
                        </span>
                    </div>
                    <p class="font-semibold text-slate-900 dark:text-white mb-3 leading-relaxed">${item.text}</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                        <div class="p-2.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-150 dark:border-slate-700">
                            <span class="text-slate-400 dark:text-slate-500 block font-bold uppercase tracking-widest text-[9px] mb-0.5">Your Choice Response</span>
                            <span class="font-mono text-slate-800 dark:text-slate-200 font-bold">${userChoice}</span>
                        </div>
                        <div class="p-2.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-150 dark:border-slate-700">
                            <span class="text-slate-400 dark:text-slate-500 block font-bold uppercase tracking-widest text-[9px] mb-0.5">Valid System Reference Target</span>
                            <span class="font-mono text-emerald-700 dark:text-emerald-400 font-bold">${item.answer}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function restartExam() {
            if (!confirm('Are you sure you want to restart this quiz?')) {
                return;
            }
            Object.keys(localStorage).forEach(key => {
                if (key.includes('exam_')) {
                    localStorage.removeItem(key);
                }
            });
            location.reload();
        }

        function goBackToQuizList() {
            window.location.href = '/arts/english/ap1';
        }
    </script>
</body>

</html>
