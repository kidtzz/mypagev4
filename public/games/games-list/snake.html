<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Retro Neon Arcade - Snake Pro (Android Compact)</title>
  <style>
    :root {
      --bg-dark: #0a0b10;
      --neon-green: #39ff14;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-purple: #9d4edd;
      --glass-bg: rgba(20, 24, 38, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --neon-glow-green: 0 0 15px rgba(57, 255, 20, 0.6);
      --neon-glow-cyan: 0 0 15px rgba(0, 243, 255, 0.6);
      --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-family);
      color: #ffffff;
    }

    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
    }

    .app-container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 10px) 16px env(safe-area-inset-bottom, 15px) 16px;
    }

    .header-panel {
      width: 100%;
      max-width: 440px;
      margin-top: 5px;
      padding: 10px 14px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8a8f98;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--neon-glow-cyan);
      color: var(--neon-cyan);
    }

    .stat-value.score {
      color: var(--neon-green);
      text-shadow: var(--neon-glow-green);
    }

    .sub-stats {
      grid-column: span 2;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 4px;
      margin-top: 2px;
      font-size: 0.75rem;
      color: #b0b5c0;
    }

    .board-container {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      margin: auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      background: rgba(12, 15, 28, 0.85);
      border: 2px solid rgba(0, 243, 255, 0.3);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 0, 0, 0.6);
      display: block;
      transition: border-color 0.2s;
    }

    #game-canvas.turbo-active {
      border-color: var(--neon-pink);
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.6);
    }

    .action-bar {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-around;
      gap: 8px;
      margin-bottom: 5px;
    }

    .action-btn {
      flex: 1;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: #ffffff;
      padding: 8px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--neon-cyan);
    }

    /* COMPACT & AMAN: Ukuran D-PAD Diperkecil Agar Tidak Tenggelam */
    .touch-controls {
      width: 100%;
      max-width: 240px;
      /* Diperkecil dari 340px */
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 8px;
      /* Jarak antar tombol dipersempit */
      margin-bottom: env(safe-area-inset-bottom, 10px);
    }

    .dpad-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      /* Lebih proporsional */
      color: #ffffff;
      font-size: 1.4rem;
      /* Font tombol diperkecil */
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      aspect-ratio: 1 / 1;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.05);
      transition: background 0.1s, transform 0.1s;
    }

    .dpad-btn.pressing {
      background: rgba(255, 0, 127, 0.3) !important;
      border-color: var(--neon-pink) !important;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6) !important;
      transform: scale(0.92);
    }

    #btn-up {
      grid-column: 2;
      grid-row: 1;
    }

    #btn-left {
      grid-column: 1;
      grid-row: 2;
    }

    #btn-right {
      grid-column: 3;
      grid-row: 2;
    }

    #btn-down {
      grid-column: 2;
      grid-row: 3;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(6, 7, 12, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 340px;
      background: var(--glass-bg);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 243, 255, 0.1);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .title-gameover {
      color: var(--neon-pink);
      text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
    }

    .title-paused {
      color: var(--neon-purple);
      text-shadow: 0 0 15px rgba(157, 78, 221, 0.6);
    }

    .modal-stats {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left;
    }

    .modal-stat-line {
      display: flex;
      flex-direction: column;
    }

    .modal-stat-lbl {
      font-size: 0.7rem;
      color: #7e8494;
      text-transform: uppercase;
    }

    .modal-stat-val {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .menu-btn {
      width: 100%;
      background: linear-gradient(135deg, #00f3ff, #0077ff);
      border: none;
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(0, 243, 255, 0.3);
      transition: all 0.2s ease;
    }

    .menu-btn:active {
      transform: scale(0.96);
    }

    .menu-btn.btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      box-shadow: none;
    }

    .shake {
      animation: shakeAnim 0.15s linear dashed;
    }

    @keyframes shakeAnim {
      0% {
        transform: translate(2px, 1px);
      }

      20% {
        transform: translate(-1px, -2px);
      }

      40% {
        transform: translate(-3px, 0px);
      }

      60% {
        transform: translate(0px, 2px);
      }

      100% {
        transform: translate(0px, 0px);
      }
    }

    @media (min-width: 769px) and (pointer: fine) {
      .app-container {
        justify-content: center;
        gap: 15px;
        padding: 30px;
      }

      .touch-controls {
        display: none;
      }
    }
  </style>
</head>

<body>

  <canvas id="bg-canvas"></canvas>

  <div class="app-container" id="app-container">

    <div class="header-panel">
      <div class="stat-box">
        <span class="stat-label">Score</span>
        <span id="score-val" class="stat-value score">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">High Score</span>
        <span id="high-val" class="stat-value">0</span>
      </div>
      <div class="sub-stats">
        <span>Food: <strong id="food-val" style="color:var(--neon-cyan)">0</strong></span>
        <span>Length: <strong id="len-val" style="color:var(--neon-green)">3</strong></span>
      </div>
    </div>

    <div class="board-container">
      <canvas id="game-canvas" width="400" height="400"></canvas>
    </div>

    <div class="action-bar">
      <button class="action-btn" id="act-pause">⏸</button>
      <button class="action-btn" id="act-restart">🔄</button>
      <button class="action-btn" id="act-mute">🔊</button>
      <button class="action-btn" id="act-fullscreen">⛶</button>
    </div>

    <div class="touch-controls">
      <button class="dpad-btn" id="btn-up">⬆</button>
      <button class="dpad-btn" id="btn-left">⬅</button>
      <button class="dpad-btn" id="btn-right">➡</button>
      <button class="dpad-btn" id="btn-down">⬇</button>
    </div>
  </div>

  <div class="overlay" id="pause-overlay">
    <div class="modal-card">
      <h2 class="modal-title title-paused">Game Paused</h2>
      <button class="menu-btn" id="btn-resume">Resume Game</button>
      <button class="menu-btn btn-secondary" id="btn-pause-restart">Restart Match</button>
    </div>
  </div>

  <div class="overlay" id="gameover-overlay">
    <div class="modal-card">
      <h2 class="modal-title title-gameover">💀 Game Over</h2>
      <div class="modal-stats">
        <div class="modal-stat-line"><span class="modal-stat-lbl">Final Score</span><span id="mo-score"
            class="modal-stat-val">0</span></div>
        <div class="modal-stat-line"><span class="modal-stat-lbl">High Score</span><span id="mo-high"
            class="modal-stat-val">0</span></div>
        <div class="modal-stat-line"><span class="modal-stat-lbl">Food Eaten</span><span id="mo-food"
            class="modal-stat-val">0</span></div>
        <div class="modal-stat-line"><span class="modal-stat-lbl">Time Played</span><span id="mo-time"
            class="modal-stat-val">0s</span></div>
      </div>
      <button class="menu-btn" id="btn-replay">▶ Play Again</button>
    </div>
  </div>

  <script>
    const AudioSys = {
      ctx: null, muted: false,
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
      play(type) {
        if (this.muted) return; this.init();
        const ctx = this.ctx; const now = ctx.currentTime;
        if (type === 'eat') {
          let o = ctx.createOscillator(); let g = ctx.createGain(); o.type = 'triangle';
          o.frequency.setValueAtTime(261.63, now); o.frequency.exponentialRampToValueAtTime(523.25, now + 0.12);
          g.gain.setValueAtTime(0.15, now); g.gain.linearRampToValueAtTime(0, now + 0.12);
          o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.12);
        } else if (type === 'click') {
          let o = ctx.createOscillator(); let g = ctx.createGain(); o.type = 'sine';
          o.frequency.setValueAtTime(600, now); o.frequency.exponentialRampToValueAtTime(150, now + 0.05);
          g.gain.setValueAtTime(0.1, now); g.gain.linearRampToValueAtTime(0, now + 0.05);
          o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.05);
        } else if (type === 'gameover') {
          let o = ctx.createOscillator(); let g = ctx.createGain(); o.type = 'sawtooth';
          o.frequency.setValueAtTime(220, now); o.frequency.linearRampToValueAtTime(80, now + 0.5);
          g.gain.setValueAtTime(0.2, now); g.gain.linearRampToValueAtTime(0, now + 0.5);
          o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.5);
        }
      }
    };

    const BgCanvas = {
      canvas: document.getElementById('bg-canvas'),
      ctx: document.getElementById('bg-canvas').getContext('2d'),
      particles: [], mouse: { x: null, y: null },
      init() {
        this.resize(); window.addEventListener('resize', () => this.resize());
        for (let i = 0; i < 25; i++) {
          this.particles.push({
            x: Math.random() * this.canvas.width, y: Math.random() * this.canvas.height,
            radius: Math.random() * 2 + 1, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4
          });
        }
        window.addEventListener('mousemove', (e) => { this.mouse.x = e.clientX; this.mouse.y = e.clientY; });
        window.addEventListener('touchmove', (e) => { if (e.touches.length > 0) { this.mouse.x = e.touches[0].clientX; this.mouse.y = e.touches[0].clientY; } });
      },
      resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
      render() {
        let ctx = this.ctx; let w = this.canvas.width; let h = this.canvas.height;
        ctx.fillStyle = '#090a0f'; ctx.fillRect(0, 0, w, h);
        let rg = ctx.createRadialGradient(this.mouse.x || w / 2, this.mouse.y || h / 2, 10, this.mouse.x || w / 2, this.mouse.y || h / 2, Math.max(w, h) * 0.6);
        rg.addColorStop(0, 'rgba(0, 243, 255, 0.04)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(0, 243, 255, 0.2)';
        this.particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
        });
        requestAnimationFrame(() => this.render());
      }
    };

    const Game = {
      canvas: document.getElementById('game-canvas'),
      ctx: document.getElementById('game-canvas').getContext('2d'),
      gridSize: 20, tileCount: 20,
      snake: [], dir: { x: 0, y: 0 }, nextDir: { x: 0, y: 0 },
      food: { x: 0, y: 0, type: 'cyan' }, foodPulse: 0,
      score: 0, highScore: parseInt(localStorage.getItem('snake_pro_high')) || 0,
      foodEaten: 0, startTime: 0, elapsedSeconds: 0,
      isPaused: false, isGameOver: false,
      isTurbo: false, keysPressed: {}, activeTouches: 0,
      lastRenderTime: 0, baseSpeedMs: 160, particles: [], popups: [],

      init() {
        BgCanvas.init(); BgCanvas.render();
        document.getElementById('high-val').innerText = this.highScore;
        this.setupInputHandlers(); this.resetGame(); this.loop(0);
      },

      resetGame() {
        this.snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
        this.dir = { x: 0, y: -1 }; this.nextDir = { x: 0, y: -1 };
        this.score = 0; this.foodEaten = 0; this.startTime = Date.now(); this.elapsedSeconds = 0;
        this.isGameOver = false; this.isPaused = false; this.isTurbo = false;
        this.keysPressed = {}; this.activeTouches = 0; this.particles = []; this.popups = [];
        this.spawnFood(); this.updateUI();
        this.canvas.classList.remove('turbo-active');
        document.getElementById('gameover-overlay').classList.remove('active');
        document.getElementById('pause-overlay').classList.remove('active');
        document.querySelectorAll('.dpad-btn').forEach(b => b.classList.remove('pressing'));
      },

      spawnFood() {
        let valid = false;
        while (!valid) {
          this.food.x = Math.floor(Math.random() * this.tileCount);
          this.food.y = Math.floor(Math.random() * this.tileCount);
          valid = !this.snake.some(seg => seg.x === this.food.x && seg.y === this.food.y);
        }
        this.food.type = Math.random() > 0.25 ? 'cyan' : 'green';
      },

      getCurrentSpeed() {
        if (this.isTurbo) return 45;
        let stepBoost = Math.min(this.foodEaten * 4, 85);
        return this.baseSpeedMs - stepBoost;
      },

      checkTurboState() {
        const movementKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'];
        const dynamicKeyHeld = movementKeys.some(k => this.keysPressed[k]);
        this.isTurbo = dynamicKeyHeld || (this.activeTouches > 0);
        if (this.isTurbo) this.canvas.classList.add('turbo-active');
        else this.canvas.classList.remove('turbo-active');
      },

      setupInputHandlers() {
        const setDir = (x, y) => {
          if (this.dir.x !== -x && this.dir.y !== -y) this.nextDir = { x, y };
        };

        window.addEventListener('keydown', (e) => {
          if (['ArrowUp', 'KeyW', 'ArrowDown', 'KeyS', 'ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(e.code)) {
            this.keysPressed[e.code] = true; this.checkTurboState();
          }
          if (['ArrowUp', 'KeyW'].includes(e.code)) { setDir(0, -1); e.preventDefault(); }
          else if (['ArrowDown', 'KeyS'].includes(e.code)) { setDir(0, 1); e.preventDefault(); }
          else if (['ArrowLeft', 'KeyA'].includes(e.code)) { setDir(-1, 0); e.preventDefault(); }
          else if (['ArrowRight', 'KeyD'].includes(e.code)) { setDir(1, 0); e.preventDefault(); }
          else if (e.code === 'KeyP') { this.togglePause(); AudioSys.play('click'); }
          else if (e.code === 'KeyR') { this.resetGame(); AudioSys.play('click'); }
        });

        window.addEventListener('keyup', (e) => {
          if (['ArrowUp', 'KeyW', 'ArrowDown', 'KeyS', 'ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(e.code)) {
            this.keysPressed[e.code] = false; this.checkTurboState();
          }
        });

        const bindDpad = (id, x, y) => {
          const btn = document.getElementById(id);

          btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (this.isPaused || this.isGameOver) return;
            setDir(x, y);
            btn.classList.add('pressing');
            this.activeTouches++;
            this.checkTurboState();
          }, { passive: false });

          const endTouch = (e) => {
            e.preventDefault();
            btn.classList.remove('pressing');
            this.activeTouches = Math.max(0, this.activeTouches - 1);
            this.checkTurboState();
          };

          btn.addEventListener('touchend', endTouch, { passive: false });
          btn.addEventListener('touchcancel', endTouch, { passive: false });
        };

        bindDpad('btn-up', 0, -1);
        bindDpad('btn-down', 0, 1);
        bindDpad('btn-left', -1, 0);
        bindDpad('btn-right', 1, 0);

        document.getElementById('act-pause').addEventListener('click', () => { AudioSys.play('click'); this.togglePause(); });
        document.getElementById('act-restart').addEventListener('click', () => { AudioSys.play('click'); this.resetGame(); });
        document.getElementById('act-mute').addEventListener('click', () => {
          AudioSys.muted = !AudioSys.muted;
          document.getElementById('act-mute').innerText = AudioSys.muted ? "🔇" : "🔊";
        });
        document.getElementById('act-fullscreen').addEventListener('click', () => this.toggleFullscreen());
        document.getElementById('btn-resume').addEventListener('click', () => this.togglePause());
        document.getElementById('btn-pause-restart').addEventListener('click', () => this.resetGame());
        document.getElementById('btn-replay').addEventListener('click', () => this.resetGame());
      },

      togglePause() {
        if (this.isGameOver) return;
        this.isPaused = !this.isPaused;
        document.getElementById('pause-overlay').classList.toggle('active', this.isPaused);
      },

      toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => { });
        else document.exitFullscreen();
      },

      update() {
        if (this.isPaused || this.isGameOver) return;
        this.dir = { ...this.nextDir };
        this.elapsedSeconds = Math.floor((Date.now() - this.startTime) / 1000);

        let nextX = this.snake[0].x + this.dir.x;
        let nextY = this.snake[0].y + this.dir.y;

        if (nextX < 0) nextX = this.tileCount - 1;
        else if (nextX >= this.tileCount) nextX = 0;
        if (nextY < 0) nextY = this.tileCount - 1;
        else if (nextY >= this.tileCount) nextY = 0;

        const head = { x: nextX, y: nextY };

        if (this.snake.some(seg => seg.x === head.x && seg.y === head.y)) {
          this.triggerGameOver(); return;
        }

        this.snake.unshift(head);

        if (head.x === this.food.x && head.y === this.food.y) {
          AudioSys.play('eat'); this.foodEaten++;
          this.score += this.food.type === 'green' ? 20 : 10;
          if (this.score > this.highScore) {
            this.highScore = this.score; localStorage.setItem('snake_pro_high', this.highScore);
          }
          this.createExplosion(this.food.x * this.gridSize + this.gridSize / 2, this.food.y * this.gridSize + this.gridSize / 2, this.food.type);
          this.createScorePopup(this.food.x * this.gridSize, this.food.y * this.gridSize, this.food.type === 'green' ? '+20' : '+10');
          document.getElementById('app-container').classList.add('shake');
          setTimeout(() => document.getElementById('app-container').classList.remove('shake'), 150);
          this.spawnFood();
        } else {
          this.snake.pop();
        }
        this.updateUI();
      },

      triggerGameOver() {
        this.isGameOver = true; AudioSys.play('gameover');
        document.getElementById('mo-score').innerText = this.score;
        document.getElementById('mo-high').innerText = this.highScore;
        document.getElementById('mo-food').innerText = this.foodEaten;
        document.getElementById('mo-time').innerText = this.elapsedSeconds + 's';
        document.getElementById('gameover-overlay').classList.add('active');
      },

      updateUI() {
        document.getElementById('score-val').innerText = this.score;
        document.getElementById('high-val').innerText = this.highScore;
        document.getElementById('food-val').innerText = this.foodEaten;
        document.getElementById('len-val').innerText = this.snake.length;
      },

      createExplosion(x, y, type) {
        const color = type === 'green' ? 'var(--neon-green)' : 'var(--neon-cyan)';
        for (let i = 0; i < 12; i++) {
          this.particles.push({
            x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
            radius: Math.random() * 2 + 1, alpha: 1, decay: Math.random() * 0.03 + 0.02, color
          });
        }
      },

      createScorePopup(x, y, txt) { this.popups.push({ x, y, txt, alpha: 1, vy: -0.8 }); },

      render(timestamp) {
        let ctx = this.ctx; ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.foodPulse = Math.sin(timestamp / 120) * 2;
        let fRadius = (this.gridSize / 2) - 2 + this.foodPulse * 0.5;
        let fx = this.food.x * this.gridSize + this.gridSize / 2;
        let fy = this.food.y * this.gridSize + this.gridSize / 2;

        ctx.save(); ctx.shadowBlur = 15;
        ctx.shadowColor = this.food.type === 'green' ? '#39ff14' : '#00f3ff';
        ctx.fillStyle = this.food.type === 'green' ? '#39ff14' : '#00f3ff';
        ctx.beginPath(); ctx.arc(fx, fy, Math.max(2, fRadius), 0, Math.PI * 2); ctx.fill(); ctx.restore();

        this.snake.forEach((seg, idx) => {
          let isHead = idx === 0; ctx.save(); ctx.shadowBlur = isHead ? 14 : 6;
          if (this.isTurbo) {
            ctx.shadowColor = 'var(--neon-pink)'; ctx.fillStyle = isHead ? '#ff007f' : '#ff55aa';
          } else {
            ctx.shadowColor = isHead ? 'var(--neon-green)' : 'rgba(0, 243, 255, 0.4)';
            ctx.fillStyle = isHead ? '#39ff14' : '#00b7ff';
          }
          let rx = seg.x * this.gridSize + 1; let ry = seg.y * this.gridSize + 1;
          let rSize = this.gridSize - 2; let r = isHead ? 6 : 4;
          ctx.beginPath(); ctx.moveTo(rx + r, ry);
          ctx.arcTo(rx + rSize, ry, rx + rSize, ry + rSize, r); ctx.arcTo(rx + rSize, ry + rSize, rx, ry + rSize, r);
          ctx.arcTo(rx, ry + rSize, rx, ry, r); ctx.arcTo(rx, ry, rx + rSize, ry, r);
          ctx.closePath(); ctx.fill(); ctx.restore();
        });

        this.particles.forEach((p, idx) => {
          p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
          if (p.alpha <= 0) { this.particles.splice(idx, 1); return; }
          ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        this.popups.forEach((pop, idx) => {
          pop.y += pop.vy; pop.alpha -= 0.02;
          if (pop.alpha <= 0) { this.popups.splice(idx, 1); return; }
          ctx.fillStyle = `rgba(255, 255, 255, ${pop.alpha})`; ctx.font = 'bold 12px sans-serif';
          ctx.fillText(pop.txt, pop.x + 2, pop.y - 5);
        });
      },

      loop(timestamp) {
        if (!this.lastRenderTime) this.lastRenderTime = timestamp;
        const elapsed = timestamp - this.lastRenderTime;
        if (elapsed >= this.getCurrentSpeed()) {
          this.update(); this.lastRenderTime = timestamp;
        }
        this.render(timestamp); requestAnimationFrame((t) => this.loop(t));
      }
    };

    window.addEventListener('DOMContentLoaded', () => Game.init());
  </script>
</body>
