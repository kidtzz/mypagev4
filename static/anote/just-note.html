<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nothing Note — My Digital Brain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* --- CSS RESET & THEME TOKENS --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Default theme = Dark Soft */
      --bg-base: #0f1216;
      --bg-elev-1: rgba(255, 255, 255, 0.03);
      --bg-elev-2: rgba(255, 255, 255, 0.05);

      --card-bg: rgba(255, 255, 255, 0.035);
      --card-border: rgba(255, 255, 255, 0.10);
      --card-border-glow: rgba(62, 207, 142, 0.25);

      --text-main: #F3F4F6;
      --text-muted: rgba(243, 244, 246, 0.70);
      --text-faint: rgba(243, 244, 246, 0.52);

      --focus-ring: rgba(62, 207, 142, 0.65);

      /* Category Accent Colors */
      --accent-life: #34d399;
      --accent-programming: #60a5fa;
      --accent-career: #c084fc;
      --accent-ideas: #22d3ee;
      --accent-daily: #94a3b8;

      /* UI */
      --shadow-soft: 0 10px 26px rgba(0, 0, 0, 0.30);
      --shadow-card: 0 12px 30px rgba(0, 0, 0, 0.26);
      --shadow-card-hover: 0 18px 42px rgba(0, 0, 0, 0.36);
      --radius-card: 18px;
      --radius-pill: 999px;
      --content-max: 1600px;
    }

    /* Theme: Light */
    body[data-theme="light"] {
      --bg-base: #f6f7fb;
      --bg-elev-1: rgba(0, 0, 0, 0.02);
      --bg-elev-2: rgba(0, 0, 0, 0.04);

      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: rgba(0, 0, 0, 0.10);
      --card-border-glow: rgba(62, 207, 142, 0.22);

      --text-main: #0b1220;
      --text-muted: rgba(11, 18, 32, 0.70);
      --text-faint: rgba(11, 18, 32, 0.52);

      --focus-ring: rgba(16, 185, 129, 0.55);

      --shadow-soft: 0 10px 26px rgba(16, 24, 40, 0.10);
      --shadow-card: 0 12px 30px rgba(16, 24, 40, 0.10);
      --shadow-card-hover: 0 18px 42px rgba(16, 24, 40, 0.14);
    }

    /* Theme: Dark High-Contrast */
    body[data-theme="dark-contrast"] {
      --bg-base: #07090c;
      --bg-elev-1: rgba(255, 255, 255, 0.04);
      --bg-elev-2: rgba(255, 255, 255, 0.07);

      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.14);
      --card-border-glow: rgba(62, 207, 142, 0.30);

      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.78);
      --text-faint: rgba(255, 255, 255, 0.60);
    }


    /* --- CUSTOM SCROLLBAR --- */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }

    ::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-life);
    }

    /* --- BASE BODY STYLES (IMMERSIBLE ENVIRONMENT) --- */
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.8;
      position: relative;
    }

    /* Immersive Grid, Noise, and Glow Background layers */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 1;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(62, 207, 142, 0.04) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Container wrapper to pull content above background layers */
    .app-container {
      position: relative;
      z-index: 10;
      max-width: 1600px;
      margin: 0 auto;
      padding: 80px 40px;
      opacity: 0;
      transform: translateY(20px) scale(0.99);
      animation: pageIntro 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pageIntro {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* --- HEADER SECTION --- */
    header {
      text-align: center;
      margin-bottom: 60px;
    }

    header h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #FFFFFF 0%, #A3A3A3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 40px auto;
    }



    /* --- CONTROLS: SEARCH & FILTERS --- */
    .controls-wrapper {
      max-width: var(--content-max);
      margin: 0 auto 50px auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: color-mix(in srgb, var(--bg-base) 82%, transparent);
      border: 1px solid var(--card-border);
      padding: 14px 18px;
      border-radius: var(--radius-pill);
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      backdrop-filter: blur(8px);
      transition: box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--accent-life);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus-ring) 30%, transparent);
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .chip {
      background: color-mix(in srgb, var(--bg-base) 72%, transparent);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .chip:hover {
      transform: translateY(-1px);
    }

    .chip:hover,
    .chip.active {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.20);
      background: var(--card-bg);
    }

    .chip.active {
      border-color: color-mix(in srgb, var(--accent-life) 65%, var(--card-border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-life) 18%, transparent);
    }




    /* --- REAL MASONRY LAYOUT ENGINE --- */
    .masonry-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 24px;
      align-items: start;
    }

    /* Separate column track generation handling vertical density flow without gaps */
    .masonry-col {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* --- THOUGHT CARD ARCHITECTURE --- */
    .thought-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;

      transform-origin: center center;
      transition:
        transform 0.25s cubic-bezier(0.33, 1, 0.68, 1),
        border-color 0.25s cubic-bezier(0.33, 1, 0.68, 1),
        box-shadow 0.25s cubic-bezier(0.33, 1, 0.68, 1),
        opacity 0.4s ease,
        scale 0.4s ease;
      opacity: 0;
      scale: 0.92;
    }

    .thought-card.visible {
      opacity: 1;
      scale: 1;
    }

    /* Premium Micro Interactions on Hover */
    .thought-card:hover {
      transform: translateY(-6px) scale(1.01) rotate(0.4deg);
      border-color: var(--card-border-glow);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.4),
        0 0 20px rgba(62, 207, 142, 0.04);
      z-index: 50;
    }

    .card-meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Mapping dynamic accents safely via custom properties assigned in JavaScript */
    .category-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--cat-color, var(--text-muted));
      box-shadow: 0 0 8px var(--cat-color, var(--text-muted));
    }



    .thought-card h3 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: #FFFFFF;
      margin-top: 2px;
    }


    .thought-card p {
      font-size: 0.9rem;
      color: #C2C2C2;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }

    .quote-card {
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.35),
        0 0 22px rgba(255, 255, 255, 0.03);
    }

    .quote-card .card-content-preview {
      font-style: italic;
    }



    /* Card content */
    .card-content-preview {
      overflow-wrap: anywhere;
      word-wrap: break-word;
      line-height: 1.7;
      color: #C2C2C2;
    }


    .thought-card:focus-visible {
      outline: 2px solid rgba(62, 207, 142, 0.65);
      outline-offset: 3px;
    }



    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .tag:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .card-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      align-self: flex-end;
      margin-top: auto;
    }

    /* --- EMPTY STATE CONFIGURATION --- */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .empty-state-icon {
      width: 48px;
      height: 48px;
      border: 1px dashed var(--text-muted);
      border-radius: 50%;
      position: relative;
      opacity: 0.4;
    }

    .empty-state-icon::after {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid var(--text-muted);
      border-radius: 50%;
    }

    .empty-state h4 {
      font-size: 1.1rem;
      color: var(--text-main);
      font-weight: 500;
    }

    /* --- RESPONSIVE MEDIA QUERIES (BREAKPOINTS) --- */
    @media (max-width: 1400px) {
      .masonry-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 1100px) {
      .masonry-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }


    @media (max-width: 768px) {
      .masonry-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .app-container {
        padding: 40px 20px;
      }


      header h1 {
        font-size: 2.5rem;
      }
    }

    @media (max-width: 500px) {
      .masonry-grid {
        grid-template-columns: repeat(1, 1fr);
      }

      .app-container {
        padding: 28px 14px;
      }


      .controls-wrapper {
        gap: 14px;
        margin-bottom: 26px;
      }

      .search-box input {
        padding: 12px 18px;
        font-size: 0.95rem;
      }


      .masonry-col {
        gap: 16px;
      }

      .thought-card {
        padding: 16px;
        border-radius: 16px;
      }


      .thought-card h3 {
        font-size: 1.05rem;
        line-height: 1.35;
      }

      .thought-card p {
        font-size: 0.86rem;
        line-height: 1.65;
      }

      .card-content-preview {
        -webkit-line-clamp: 3;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }

      .thought-card {
        transform: none !important;
      }
    }
  </style>
</head>


<body>

  <!-- HTML -->
  <div class="app-container">
    <!-- CONTROLS CONTAINER -->
    <div class="controls-wrapper">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search thoughts..." aria-label="Search thoughts real time">
      </div>

      <div class="filter-chips" id="filterChips" role="tablist" aria-label="Category filters">
        <span class="chip active" data-category="All" role="tab" aria-selected="true">All</span>
        <span class="chip" data-category="Life" role="tab" aria-selected="false">Life</span>
        <span class="chip" data-category="Programming" role="tab" aria-selected="false">Programming</span>
        <span class="chip" data-category="Career" role="tab" aria-selected="false">Career</span>
        <span class="chip" data-category="Ideas" role="tab" aria-selected="false">Ideas</span>
        <span class="chip" data-category="Daily" role="tab" aria-selected="false">Daily</span>
      </div>


    </div>


    <!-- MAIN GRID CONTAINER -->
    <main class="masonry-grid" id="masonryGrid">
      <!-- Target structural columns generated systematically at runtime -->
      <div class="empty-state" id="emptyState">
        <div class="empty-state-icon"></div>
        <h4>No thoughts found.</h4>
      </div>
    </main>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    // State Space
    let globalNotes = [];
    let currentCategory = "All";
    let searchQuery = "";

    const DEFAULT_SORT_DESC = true;

    const accentMap = {

      "life": "var(--accent-life)",
      "programming": "var(--accent-programming)",
      "career": "var(--accent-career)",
      "ideas": "var(--accent-ideas)",
      "daily": "var(--accent-daily)"
    };


    // Dom References

    const searchInput = document.getElementById("searchInput");
    const filterChips = document.getElementById("filterChips");
    const masonryGrid = document.getElementById("masonryGrid");
    const emptyState = document.getElementById("emptyState");

    // Initialize System Lifecycle
    document.addEventListener("DOMContentLoaded", () => {
      initApp();
    });


    async function initApp() {
      try {
        const response = await fetch("noted.json");

        if (!response.ok) throw new Error("Network schema profile payload unreadable.");
        globalNotes = await response.json();


        if (DEFAULT_SORT_DESC) {
          globalNotes.sort((a, b) => {
            const da = new Date(a?.date || 0).getTime();
            const db = new Date(b?.date || 0).getTime();
            return db - da;
          });
        }



        renderGrid();
        setupListeners();
      } catch (error) {

        console.error("Critical Failure Loading Second Brain Ecosystem Data Data:", error);
      }
    }

    // Dynamic Statistics Core Engine Calculation
    function calculateMetrics(notes) {
      if (!notes.length) return;

      document.getElementById("statThoughts").textContent = notes.length;

      const categories = new Set(notes.map(n => n.category));
      document.getElementById("statCategories").textContent = categories.size;



      const sortedDates = [...notes]
        .map(n => n.date)
        .filter(Boolean)
        .sort((a, b) => new Date(a) - new Date(b));

      if (sortedDates.length) {
        document.getElementById("statOldest").textContent = formatDateLabel(sortedDates[0]);
        document.getElementById("statNewest").textContent = formatDateLabel(sortedDates[sortedDates.length - 1]);
      }
    }

    function formatDateLabel(dateStr) {
      const options = { month: 'short', day: 'numeric', year: 'numeric' };
      return new Date(dateStr).toLocaleDateString('en-US', options);
    }

    // Interactive Listener Bindings
    function setupListeners() {
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderGrid();
      });

      filterChips.addEventListener("click", (e) => {
        const targetChip = e.target.closest(".chip");
        if (!targetChip) return;

        document.querySelectorAll(".chip").forEach(c => {
          c.classList.remove("active");
          c.setAttribute("aria-selected", "false");
        });

        targetChip.classList.add("active");
        targetChip.setAttribute("aria-selected", "true");
        currentCategory = targetChip.getAttribute("data-category");
        renderGrid();
      });

      // Track re-calculations on resizing layout bounds dynamically
      window.addEventListener("resize", debounce(() => renderGrid(), 150));
    }

    // Calculate Column Configurations based on Dynamic Layout Sizes
    function getColumnCount() {
      const width = window.innerWidth;
      if (width > 1400) return 5;
      if (width > 1100) return 4;
      if (width > 768) return 3;
      if (width > 520) return 2;
      return 1;
    }


    // Fluid Filter & Render Core Engine
    function renderGrid() {
      // 1. Filtering Logic Pipeline
      const filtered = globalNotes.filter(note => {
        const matchesCategory = (currentCategory === "All" || note.category === currentCategory);
        const title = (note.title || "").toLowerCase();
        const content = (note.content || "").toLowerCase();
        const category = (note.category || "").toLowerCase();
        const matchesSearch = !searchQuery ||
          title.includes(searchQuery) ||
          content.includes(searchQuery) ||
          category.includes(searchQuery);

        return matchesCategory && matchesSearch;
      });



      // Clear existing setup, saving only the empty state element node
      const colsCount = getColumnCount();
      masonryGrid.querySelectorAll(".masonry-col").forEach(col => col.remove());

      if (filtered.length === 0) {
        emptyState.style.display = "flex";
        return;
      }
      emptyState.style.display = "none";

      // 2. Initialize Structural Layout Tracks
      const colElements = [];
      for (let i = 0; i < colsCount; i++) {
        const col = document.createElement("div");
        col.className = "masonry-col";
        masonryGrid.appendChild(col);
        colElements.push(col);
      }

      // 3. Systematically Distribute Card Elements Evenly Across Columns
      filtered.forEach((note, index) => {
        const targetColIndex = index % colsCount;
        const card = createCardElement(note, index);
        colElements[targetColIndex].appendChild(card);

        // Staggered Micro-Animation Framework trigger via requestAnimationFrame
        // Cap delay so large datasets don't feel sluggish.
        const cappedIndex = Math.min(index, 30);
        requestAnimationFrame(() => {
          setTimeout(() => {
            card.classList.add("visible");
          }, cappedIndex * 40);
        });
      });

    }

    // DOM Node Template Component Builder
    function createCardElement(note, index) {
      const tags = (note.tags || []).map(t => String(t));
      const tagSet = new Set(tags.map(t => t.toLowerCase()));

      const category = note.category || "";
      // Card UI simplified (no show more / show less)

      // Meta types preserved only if you want to extend styles later.
      const metaTypes = [];
      const hasQuote = tagSet.has('quote') || tagSet.has('quotes');
      if (tagSet.has('daily') || tagSet.has('routine') || tagSet.has('productivity')) metaTypes.push('Daily');
      if (tagSet.has('todo') || tagSet.has('task') || tagSet.has('checklist') || tagSet.has('routine')) metaTypes.push('To-do');
      if (hasQuote) metaTypes.push('Quote');
      if (metaTypes.length === 0) metaTypes.push('Life');




      const card = document.createElement("article");
      card.className = "thought-card";
      card.setAttribute("tabindex", "0");

      const accentColor = accentMap[(category || "").toLowerCase()] || "var(--text-muted)";
      card.style.setProperty("--cat-color", accentColor);


      if (hasQuote) {
        card.classList.add('quote-card');
      }

      // accentColor is a CSS var like: var(--accent-life) 
      // We cannot do a safe string replace without knowing its structure, so use the base glow var fallback.
      card.style.setProperty("--card-border-glow", "rgba(255,255,255,0.12)");


      const tagHtml = tags.map(t => `<span class="tag">#${t}</span>`).join("");


      card.innerHTML = `
        <div class="card-meta-top">
          <span class="category-badge">${escapeHtml(category)}</span>
        </div>

        <h3>${escapeHtml(note.title)}</h3>


        <p class="card-content-preview">${escapeHtml(note.content || "")}</p>



        <div class="card-date">${formatDateLabel(note.date)}</div>

      `;




      // Collapsed default label is already set by HTML template.


      return card;
    }


    // Security sanitization utility for handling localized strings safely
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Layout Optimization Engine Helpers
    function debounce(func, wait) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    function initTheme() {
      // Theme toggle removed: keep default visual style (dark soft).
      document.body.removeAttribute("data-theme");
    }

  </script>
</body>

</html>
